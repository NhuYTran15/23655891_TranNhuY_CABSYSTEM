tripPayments:
  parameters:
  - name: tripId
    in: path
    required: true
    description: Trip identifier.
    schema:
      type: string
  post:
    tags:
    - Payments
    summary: Create a payment for a trip
    description: Supports CASH or ELECTRONIC payment. Electronic payment is processed through an external provider and CAB
      must not store raw sensitive payment details.
    operationId: createTripPayment
    x-srs-trace:
    - FR11
    - FR12
    - FR13
    - BR07
    - BR08
    - UC06
    - AC09
    - AC10
    requestBody:
      required: true
      description: Payload for PaymentCreateRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PaymentCreateRequest
    responses:
      '201':
        description: Payment created/processed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Payment
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
paymentById:
  parameters:
  - name: paymentId
    in: path
    required: true
    description: Payment identifier.
    schema:
      type: string
  get:
    tags:
    - Payments
    summary: Get payment result
    operationId: getPayment
    x-srs-trace:
    - FR13
    - AC10
    responses:
      '200':
        description: Payment information.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Payment
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
