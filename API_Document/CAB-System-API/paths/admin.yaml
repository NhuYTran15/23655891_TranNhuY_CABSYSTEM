adminCustomers:
  get:
    tags:
    - Administration
    summary: List customers for operations management
    operationId: adminListCustomers
    x-srs-trace:
    - FR17
    - UC08
    - AC13
    responses:
      '200':
        description: Customer list.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Customer
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
adminDrivers:
  get:
    tags:
    - Administration
    summary: List drivers for operations management
    operationId: adminListDrivers
    x-srs-trace:
    - FR18
    - UC08
    - AC13
    responses:
      '200':
        description: Driver list.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Driver
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags:
    - Administration
    summary: Create a driver account as operations staff
    operationId: adminCreateDriver
    x-srs-trace:
    - FR18
    - UC08
    - AC13
    requestBody:
      required: true
      description: Payload for DriverRegistrationRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/DriverRegistrationRequest
    responses:
      '201':
        description: Driver account created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Driver
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
adminVehicles:
  get:
    tags:
    - Administration
    summary: List vehicles for operations management
    operationId: adminListVehicles
    x-srs-trace:
    - FR19
    - UC08
    - AC13
    responses:
      '200':
        description: Vehicle list.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Vehicle
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
adminTrips:
  get:
    tags:
    - Administration
    summary: List and monitor trips
    operationId: adminListTrips
    x-srs-trace:
    - FR20
    - FR22
    - UC08
    parameters:
    - name: status
      in: query
      required: false
      description: Optional trip status filter.
      schema:
        type: string
    responses:
      '200':
        description: Trips.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Trip
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
adminTripResolution:
  parameters:
  - name: tripId
    in: path
    required: true
    description: Trip identifier.
    schema:
      type: string
  patch:
    tags:
    - Administration
    summary: Record an operations action for a problematic trip
    description: The SRS requires operations staff to support trip-error handling but does not define detailed recovery rules.
    operationId: adminResolveTripIssue
    x-srs-trace:
    - FR22
    - UC08
    requestBody:
      required: true
      description: Payload for AdminTripResolutionRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminTripResolutionRequest
    responses:
      '200':
        description: Trip after operations handling.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Trip
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
adminTransactions:
  get:
    tags:
    - Administration
    summary: Search transaction history
    operationId: adminListTransactions
    x-srs-trace:
    - FR21
    - UC08
    responses:
      '200':
        description: Transaction history.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Transaction
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
