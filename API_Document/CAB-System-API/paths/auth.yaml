customerRegister:
  post:
    tags:
    - Authentication
    summary: Register a customer account
    description: Allows a Customer to register. Credential policy is not defined by the SRS.
    operationId: registerCustomer
    x-srs-trace:
    - Account Management
    - UC01
    - AC01
    requestBody:
      required: true
      description: Payload for CustomerRegistrationRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CustomerRegistrationRequest
    responses:
      '201':
        description: Customer account created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/BadRequest
driverRegister:
  post:
    tags:
    - Authentication
    summary: Register a driver account
    description: Allows Driver registration. The SRS also allows operations staff to create driver accounts.
    operationId: registerDriver
    x-srs-trace:
    - Account Management
    - UC01
    requestBody:
      required: true
      description: Payload for DriverRegistrationRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/DriverRegistrationRequest
    responses:
      '201':
        description: Driver account created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Driver
      '400':
        $ref: ../components/responses.yaml#/BadRequest
login:
  post:
    tags:
    - Authentication
    summary: Authenticate a user
    description: Authenticates Customer, Driver, or Admin. The SRS requires authentication but does not specify JWT, OAuth,
      cookies, or another mechanism.
    operationId: login
    x-srs-trace:
    - BR01
    - FR23
    - UC01
    - AC01
    requestBody:
      required: true
      description: Payload for LoginRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/LoginRequest
    responses:
      '200':
        description: Authentication successful.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LoginResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
