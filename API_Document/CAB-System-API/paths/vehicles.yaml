driverVehicles:
  parameters:
  - name: driverId
    in: path
    required: true
    description: Driver identifier.
    schema:
      type: string
  get:
    tags:
    - Vehicles
    summary: Get vehicles for a driver
    operationId: getDriverVehicles
    x-srs-trace:
    - FR19
    responses:
      '200':
        description: Driver vehicles.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Vehicle
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    tags:
    - Vehicles
    summary: Create vehicle information for a driver
    operationId: createDriverVehicle
    x-srs-trace:
    - FR19
    requestBody:
      required: true
      description: Payload for VehicleCreateRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/VehicleCreateRequest
    responses:
      '201':
        description: Vehicle created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Vehicle
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
vehicleById:
  parameters:
  - name: vehicleId
    in: path
    required: true
    description: Vehicle identifier.
    schema:
      type: string
  get:
    tags:
    - Vehicles
    summary: Get vehicle information
    operationId: getVehicle
    x-srs-trace:
    - FR19
    responses:
      '200':
        description: Vehicle information.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Vehicle
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
  patch:
    tags:
    - Vehicles
    summary: Update vehicle information
    operationId: updateVehicle
    x-srs-trace:
    - FR19
    requestBody:
      required: true
      description: Payload for VehicleUpdateRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/VehicleUpdateRequest
    responses:
      '200':
        description: Updated vehicle.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Vehicle
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
