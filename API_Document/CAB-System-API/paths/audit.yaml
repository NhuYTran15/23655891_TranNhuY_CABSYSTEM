auditLogs:
  get:
    tags:
    - Audit
    summary: Get audit logs
    description: Provides traceability for important operations as required by the SRS.
    operationId: getAuditLogs
    x-srs-trace:
    - FR24
    - BR11
    - AC15
    responses:
      '200':
        description: Audit logs.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/AuditLog
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
