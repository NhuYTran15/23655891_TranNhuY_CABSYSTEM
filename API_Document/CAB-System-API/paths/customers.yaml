customerById:
  parameters:
  - name: customerId
    in: path
    required: true
    description: Customer identifier.
    schema:
      type: string
  get:
    tags:
    - Customers
    summary: Get customer profile
    operationId: getCustomer
    x-srs-trace:
    - Account Management
    - FR17
    responses:
      '200':
        description: Customer profile.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Customer
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
  patch:
    tags:
    - Customers
    summary: Update customer profile
    operationId: updateCustomer
    x-srs-trace:
    - Account Management
    - FR17
    requestBody:
      required: true
      description: Payload for CustomerUpdateRequest.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CustomerUpdateRequest
    responses:
      '200':
        description: Updated customer profile.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
customerBookings:
  parameters:
  - name: customerId
    in: path
    required: true
    description: Customer identifier.
    schema:
      type: string
  get:
    tags:
    - Customers
    - Bookings
    summary: Get customer booking/trip history
    description: Supports the SRS requirement for customers to view trip history.
    operationId: getCustomerBookings
    x-srs-trace:
    - FR15
    - BR05
    responses:
      '200':
        description: Customer booking history.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '404':
        $ref: ../components/responses.yaml#/NotFound
