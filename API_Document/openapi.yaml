openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: 'API documentation derived from SRS.md for ABC Company''s CAB System.


    Scope covered: account management, booking, driver/vehicle management, driver matching,

    trip tracking, fare, payment, notifications, rating, administration, reporting, and audit.


    Important SRS gaps intentionally left implementation-specific:

    - detailed fare formula

    - driver ranking/priority algorithm

    - driver response timeout

    - cancellation policy

    - offline/network-loss handling

    - data retention period

    - concrete payment provider

    - concrete notification provider/channel

    - concrete authentication mechanism'
tags:
- name: Authentication
  description: Registration and authentication.
- name: Customers
  description: Customer profile and history.
- name: Drivers
  description: Driver profile, availability, and location.
- name: Locations
  description: Driver location tracking.
- name: Vehicles
  description: Vehicle information.
- name: Bookings
  description: Booking creation and tracking.
- name: Driver Matching
  description: Offer and driver response during matching.
- name: Trips
  description: Trip execution and status.
- name: Fares
  description: Trip fare information.
- name: Payments
  description: Cash/electronic payment processing.
- name: Ratings
  description: Post-trip driver ratings.
- name: Notifications
  description: Customer and driver notifications.
- name: Administration
  description: Operations/admin management functions.
- name: Reports
  description: Business reports requested by management.
- name: Audit
  description: Audit logs for important actions.
